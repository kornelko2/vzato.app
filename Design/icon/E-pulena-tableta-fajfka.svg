<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Vzato icon draft E: capsule white / red stripe / light blue, red check mark bottom left -->
  <rect width="1024" height="1024" fill="#3F8A5C"/>
  <g transform="translate(552 462) rotate(45)">
    <!-- white half (upper left) -->
    <path d="M -12 -168 H -192 A 168 168 0 0 0 -192 168 H -12 Z" fill="#FFFFFF"/>
    <!-- red stripe -->
    <rect x="-12" y="-168" width="24" height="336" fill="#E0453A"/>
    <!-- light blue half (lower right) -->
    <path d="M 12 -168 H 192 A 168 168 0 0 1 192 168 H 12 Z" fill="#BFDCF5"/>
  </g>
  <!-- red check mark, bottom left -->
  <circle cx="236" cy="796" r="138" fill="#FFFFFF"/>
  <path d="M 168 800 L 218 850 L 308 740" fill="none" stroke="#E0453A" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
