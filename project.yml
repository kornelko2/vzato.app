name: Vzato
options:
  bundleIdPrefix: app.vzato
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  xcodeVersion: "16.0"

# Config/Defaults.xcconfig holds project defaults and includes the gitignored
# Config/Local.xcconfig (DEVELOPMENT_TEAM, optional CloudKit switches) when present.
configFiles:
  Debug: Config/Defaults.xcconfig
  Release: Config/Defaults.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "8"
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Organizer

targets:
  Vzato:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Vzato
    info:
      path: Vzato/Info.plist
      properties:
        CFBundleDisplayName: Vzato
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.medical
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Vzato uses the camera to photograph your medication, pills and leaflets. The photos stay on your device.
        VzatoCloudKit: $(VZATO_CLOUDKIT)
        VzatoAppGroup: $(VZATO_APP_GROUP)
        UIBackgroundModes: [remote-notification]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vzato
        TARGETED_DEVICE_FAMILY: "1,2"
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Config/iOS-$(VZATO_ENTITLEMENTS_VARIANT).entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Config/iOS-$(VZATO_ENTITLEMENTS_VARIANT).entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/macOS-$(VZATO_ENTITLEMENTS_VARIANT).entitlements
    dependencies:
      - target: VzatoWidgets

  # Home screen, Lock Screen and Notification Centre widgets. Compiles the shared model and
  # services directly; those files must stay free of UIApplication / NSApplication.
  VzatoWidgets:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: VzatoWidgets
      - path: Vzato/Models
      - path: Vzato/Services
      - path: Vzato/App/PersistenceController.swift
      - path: Vzato/App/AppSettings.swift
      - path: Vzato/Views/Shared/Theme.swift
      - path: Vzato/Resources/Localizable.xcstrings
      - path: Vzato/Resources/PrivacyInfo.xcprivacy
      - path: Vzato/Resources/Sounds
    info:
      path: VzatoWidgets/Info.plist
      properties:
        CFBundleDisplayName: Vzato
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        VzatoAppGroup: $(VZATO_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vzato.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Config/Widgets-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Config/Widgets-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/Widgets-macOS.entitlements

  VzatoTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: VzatoTests
    dependencies:
      - target: Vzato
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # Drives the real app in the simulator (typing, tapping). iOS only.
  VzatoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VzatoUITests
    dependencies:
      - target: Vzato
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Vzato
        PRODUCT_BUNDLE_IDENTIFIER: app.vzato.uitests

schemes:
  Vzato:
    build:
      targets:
        Vzato: all
        VzatoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VzatoTests
        - VzatoUITests
    archive:
      config: Release
