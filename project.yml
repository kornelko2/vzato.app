name: Vzato
options:
  bundleIdPrefix: app.vzato
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  xcodeVersion: "16.0"

# Machine-specific signing (DEVELOPMENT_TEAM) lives in Config/Local.xcconfig, which is
# gitignored. Copy Config/Local.xcconfig.example to Config/Local.xcconfig first.
configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  Vzato:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Vzato
    info:
      path: Vzato/Info.plist
      properties:
        CFBundleDisplayName: Vzato
        LSApplicationCategoryType: public.app-category.medical
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vzato
        TARGETED_DEVICE_FAMILY: "1,2"
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/Vzato-macOS.entitlements

  VzatoTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: VzatoTests
    dependencies:
      - target: Vzato
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Vzato:
    build:
      targets:
        Vzato: all
        VzatoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VzatoTests
    archive:
      config: Release
